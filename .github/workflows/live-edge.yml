# The live edge, publishing itself inside its lane.
#
# PRINCIPLES v1.1.0 Principle 12 and LIVE-EDGE-CHECKLIST v1.0.0; decision record
# D23. The logic is in src/live_edge_lane.py, so this file stays thin and the
# checks are testable offline (src/test_live_edge_lane.py). Any change to this
# file, to governance/live-edge-allowlist.txt or to src/ is build-lane work:
# Aaron reads it, then it ships.
#
# TWO JOBS (D23, attack read findings 1 to 3). `build` runs everything that
# executes third-party code: the pull, the packages and the page build. It holds
# a read-only token and hands over one thing, a bundle of the listed files it
# changed. `publish` checks out the run's commit afresh and runs only this
# repository's own standard-library code from that checkout. It applies the
# bundle, re-checks it, commits once and pushes. It is the only job that sees a
# write token, and only in the steps that need one.
#
# A failure before the push publishes nothing and commits nothing. A failure
# after it means the content is already live, and the run does not revert itself.
#
# SWITCH IT OFF in one action: `gh workflow disable live-edge.yml`, or GitHub,
# Actions, Live edge, the "..." menu, Disable workflow. Back on with
# `gh workflow enable live-edge.yml`. (CLAUDE.md, "The live edge".)

name: Live edge

on:
  schedule:
    # Tuesdays 14:17 UTC: 07:17 Pacific in summer, 06:17 in winter. openFDA's
    # last_updated has landed on Mondays. Off the hour on purpose.
    - cron: "17 14 * * 2"
  workflow_dispatch:
    inputs:
      rehearse_failure:
        description: "Fail on purpose after every gate and before the commit (tests the failure notification)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: live-edge
  cancel-in-progress: false

jobs:
  build:
    # Only the default branch builds; a dispatch on any other ref exits here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUN_SHA: ${{ github.sha }}
    steps:
      - name: Check out the run's commit with its full history, no credential kept
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.14.6, the freeze's interpreter version
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Install the pinned packages, by hash, binaries only
        run: "python -m pip install --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: -r requirements-live.txt"

      - name: Read the allow-list from the run's commit, before anything builds
        run: python src/live_edge_lane.py --head "$RUN_SHA" allowlist --out "$RUNNER_TEMP/allowlist.json"

      - name: Re-render check, before new data is applied
        run: python src/live_edge_lane.py --head "$RUN_SHA" rerender-check --list "$RUNNER_TEMP/allowlist.json"

      - name: Pull the live edge (seven keyless openFDA requests)
        run: python src/pull_live_edge.py

      - name: Reconcile, and rebuild both pages
        run: python src/reconcile_live_edge.py

      - name: The run's own record says it is a result to publish
        run: python src/live_edge_lane.py outcome

      - name: Live-edge tests
        run: python src/test_live_edge.py

      - name: Lane tests
        run: python src/test_live_edge_lane.py

      - name: Golden test
        run: python src/test_golden.py

      - name: Freeze gate
        run: python src/validate_freeze.py

      - name: Domain gate, the checks the runner can run
        run: python src/live_edge_lane.py gates

      - name: Rehearsal stop (dispatch input rehearse_failure)
        if: ${{ inputs.rehearse_failure }}
        run: |
          echo "::error::Rehearsal: rehearse_failure was set, so this run stops here, after every gate and before the commit. Nothing is committed and nothing is pushed."
          exit 1

      # A failed build job leaves evidence (D24). The first scheduled stop,
      # run 38461394517 on 2026-10-13, failed at the pull and left nothing: the run
      # record naming the material months was written on the runner and died with
      # the job, and the log prints only the counts. These two steps run only when
      # an earlier step failed. They gather the run record, the vintage the pull
      # wrote, the checks and a summary into a folder OUTSIDE the tree and upload it
      # under a name the publish job never asks for, kept longer than the bundle.
      # The summary also goes to the run page, so the failure page names what
      # stopped the run without a log read. Standard library only; nothing here
      # changes the tree, the bundle, the publish job or either token.
      - name: On failure, gather the evidence and write the step summary
        if: ${{ failure() }}
        env:
          RUN_ID: ${{ github.run_id }}
          REHEARSAL: ${{ inputs.rehearse_failure }}
          DIAG: ${{ runner.temp }}/diagnostics
        run: |
          mkdir -p "$DIAG"
          if ! command -v python >/dev/null 2>&1; then
            echo "## Live edge run $RUN_ID stopped before Python was set up; see the job log." | tee -a "$GITHUB_STEP_SUMMARY" > "$DIAG/summary.md"
            exit 0
          fi
          python - <<'EOF'
          import json, os, pathlib, shutil, subprocess
          diag = pathlib.Path(os.environ["DIAG"]); diag.mkdir(parents=True, exist_ok=True)
          run_id = os.environ.get("RUN_ID", "?"); rehearsal = os.environ.get("REHEARSAL", "") == "true"
          live = pathlib.Path("data/live"); rec_p = live / "last_live_run.json"
          def git(*a):
              return subprocess.run(["git", *a], capture_output=True, text=True, check=False)
          status = git("status", "--porcelain=v1", "--untracked-files=all", "--", "data/live", "governance", "docs").stdout
          (diag / "git_status.txt").write_text(status or "(the tree equals the run's commit: nothing was written)\n", encoding="utf-8")
          fresh = git("diff", "--quiet", "--", str(rec_p)).returncode != 0 or (rec_p.exists() and git("ls-files", "--error-unmatch", str(rec_p)).returncode != 0)
          rec = json.loads(rec_p.read_text(encoding="utf-8")) if rec_p.exists() else None
          kept = []
          for p in (rec_p, live / "watermark.json"):
              if p.exists():
                  shutil.copy2(p, diag / p.name); kept.append(p.name + ("" if fresh else " (as committed; this run did not write it)"))
          vint = (rec or {}).get("vintage")
          vdir = live / "counts" / vint if vint else None
          if vdir and vdir.is_dir():
              shutil.copytree(vdir, diag / "vintage" / vint); kept.append("vintage/%s/ (%d files)" % (vint, sum(1 for _ in vdir.iterdir())))
          checks = (rec or {}).get("checks", []) if fresh else []
          failed = [c for c in checks if not c.get("passed")]
          (diag / "checks.txt").write_text("".join("%s  %s: %s\n" % ("PASS" if c.get("passed") else "FAIL", c.get("check"), c.get("value")) for c in checks)
                                           or "(no checks: this run's pull did not write a record)\n", encoding="utf-8"); kept.append("checks.txt")
          L = ["## Live edge run %s stopped before the commit; nothing was published" % run_id, ""]
          if rehearsal:
              L.append("**What stopped it:** the dispatch input `rehearse_failure` was set. Every gate ran and passed; the rehearsal stop is the failure.")
          elif rec and fresh and failed:
              L.append("**What stopped it:** the pull's own check%s failed: %s." % ("s" if len(failed) > 1 else "", "; ".join("`%s` = %s" % (c.get("check"), c.get("value")) for c in failed)))
          elif rec and fresh and rec.get("status") != "ok":
              L.append("**What stopped it:** the pull reported status `%s`%s%s." % (rec.get("status"), ("; error %s" % rec["error"]) if rec.get("error") else "", ("; notes %s" % rec["notes"]) if rec.get("notes") else ""))
          elif rec and fresh:
              L.append("**What stopped it:** the pull passed (status `%s`, %d checks); a later step failed. The job log names it." % (rec.get("status"), len(checks)))
          else:
              L.append("**What stopped it:** a step before the pull wrote a record. The job log names it; `last_live_run.json` here is the committed one, not this run's.")
          fv = ((rec or {}).get("frozen_variance") or {}) if fresh else {}
          if fv:
              L += ["", "**Frozen months re-read:** %s compared, %s reading higher (+%s reports), %s reading lower, %s lower by more than 1%%." % (fv.get("months_compared"), fv.get("months_reading_higher"), fv.get("reports_added_to_frozen_months"), fv.get("months_reading_lower"), len(fv.get("material_downward", [])))]
              if fv.get("material_downward"):
                  L += ["", "| Code | Month | Frozen | Live | Change |", "|---|---|---:|---:|---:|"]
                  L += ["| %s | %s | %s | %s | %+d |" % (m["code"], m["month"], m["frozen"], m["live"], m["live"] - m["frozen"]) for m in fv["material_downward"]]
                  L += ["", "A frozen month is never re-stated by a run. What happens next is build-lane work: Aaron reads `governance/decision-record.md` D24 and decides."]
          L += ["", "**Kept in the artifact `live-edge-diagnostics-%s`:** %s." % (run_id, ", ".join(kept)), ""]
          text = "\n".join(L)
          (diag / "summary.md").write_text(text, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(text + "\n")
          print(text)
          EOF

      - name: On failure, keep the evidence for 90 days, under a name the publish job never takes
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-edge-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: error
          retention-days: 90

      - name: Path check, then bundle the listed files
        run: python src/live_edge_lane.py --head "$RUN_SHA" bundle --list "$RUNNER_TEMP/allowlist.json" --out "$RUNNER_TEMP/live-edge.tar"

      - name: Hand the bundle to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-edge-bundle
          path: ${{ runner.temp }}/live-edge.tar
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    env:
      RUN_SHA: ${{ github.sha }}
    steps:
      - name: Check out the run's commit afresh, no credential kept
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.14.6 (standard library only in this job; nothing is installed)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Take the build job's bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: live-edge-bundle
          path: ${{ runner.temp }}/in

      - name: Read the allow-list from the run's commit
        run: python src/live_edge_lane.py --head "$RUN_SHA" allowlist --out "$RUNNER_TEMP/allowlist.json"

      - name: Apply the bundle, listed regular files only
        run: python src/live_edge_lane.py --head "$RUN_SHA" apply --list "$RUNNER_TEMP/allowlist.json" --bundle "$RUNNER_TEMP/in/live-edge.tar"

      - name: The run's record, re-read here
        run: python src/live_edge_lane.py outcome

      - name: Freeze gate, re-run here
        run: python src/validate_freeze.py

      - name: Path check
        run: python src/live_edge_lane.py --head "$RUN_SHA" path-check --list "$RUNNER_TEMP/allowlist.json"

      - name: Stage by name
        run: |
          git config core.hooksPath .githooks
          python src/live_edge_lane.py --head "$RUN_SHA" stage --list "$RUNNER_TEMP/allowlist.json"

      - name: Commit with a fixed identity
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          what=$(python -c "import json; r = json.load(open('data/live/last_live_run.json', encoding='utf-8')); print('vintage %s' % r['vintage'] if r.get('vintage') else r['status'])")
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Live edge: ${what} (run ${RUN_ID})" -m "Published by .github/workflows/live-edge.yml in the live-edge lane (D23)."

      - name: Range check against the run's commit
        run: python src/live_edge_lane.py --head "$RUN_SHA" range-check --list "$RUNNER_TEMP/allowlist.json" --base "$RUN_SHA"

      - name: Push, plain, the only step with the write token
        id: push
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main

      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Pages' latest build before the request (does a push from this token start one on its own?):"
          gh api "repos/$REPO/pages/builds/latest" --jq '"  commit \(.commit) status \(.status) created \(.created_at)"' || true
          gh api -X POST "repos/$REPO/pages/builds" --jq '"requested: \(.status) \(.url)"'

      - name: The public pages serve this commit
        if: ${{ always() && steps.push.outcome == 'success' }}
        run: python src/live_edge_lane.py --head "$RUN_SHA" verify-live --list "$RUNNER_TEMP/allowlist.json"

      - name: A failure after the push
        if: ${{ (failure() || cancelled()) && steps.push.outcome == 'success' }}
        run: |
          echo "::error::A step after the push failed or was cancelled. The commit is already on main and its content is already live or about to be. This run does not revert itself: a revert is a second publication. What happens next is Aaron's call, as build-lane work (PRINCIPLES 12)."
          exit 1
