# governance/freeze.toml - the module-specific half of the freeze gate.
#
# Instantiated from cascadia-standards/templates/freeze.example.toml v1.0.0.
# `src/validate_freeze.py` is a verbatim copy of the template and is never
# edited here; everything module-specific is in this file.
#
# THIS MODULE'S FREEZE HAS TWO HALVES, as cascadia-matter-ledger's does:
#
#   the hash gate   the gitignored staging responses are the same bytes
#                   src/validate.py, against data/raw/manifest.json
#
#   the diff gate   the committed artifacts have not moved
#                   this file, read by src/validate_freeze.py
#
# The record-level payloads are gitignored on purpose (narratives, patient
# arrays, addresses; 363 MB gzipped across 696 pages), with the reason
# recorded in .gitignore, CLAUDE.md and governance/source-register.md. That is
# a deliberate, documented departure from PRINCIPLES rule 1's mechanism.
#
# THE PROTECTED LIST GROWS BY PHASE, each addition its own commit, and the
# baseline moves to the commit that last legitimately added a protected
# artifact, stated here with its reason. Phases 1 and 2 landed together in
# the freeze commit below. Phase 3 adds the forecast, score, review and
# recall tables by name; Phase 4 adds docs/index.html.
#
# EVERY PATH HERE IS NAMED, NOT GLOBBED, except the count series. A glob over
# data/conformed/ would fail the gate the moment Phase 3 adds a table that did
# not exist at the baseline, which is the Revenue Assurance lesson; naming the
# files makes "which artifacts are frozen" a list a reader can check against
# the metric register.

[freeze]
module = "cascadia-early-warning"

# Newest receipt date in the source at retrieval (2026-10-06; the API's own
# meta.last_updated for the event endpoint was 2026-09-29). Claimed on the
# page. Advancing it is a deliberate act; see CLAUDE.md.
as_of_date = "2026-08-31"

# The Phase 5 commit, whose only change to a protected path is the one
# live-edge line src/reconcile_live_edge.py writes into the page; the Phase 1
# to 4 artifacts were frozen at 777ab234d7de, 12dcaf1a7abf and 3434e0f2d6ef
# and are unchanged since (the gate at the previous baseline failed on that
# one line and on nothing else, which is the interaction D18 records).
# Strictly stronger than "HEAD": a committed change to any path below is
# caught, not only an uncommitted one.
baseline = "6b519ffe8d744e1e409ca98f8f3e24e5ee82a51a"

# EVERY PATH HERE MUST BE GIT-TRACKED. A gitignored path FAILS OPEN: Path.glob
# matches the filesystem, `git diff --quiet` reports no change on an untracked
# file, and the path reads as checked and passing forever. The staging pages
# and the bulk zips are protected by the hash gate, not by this list.
protected_paths = [
  "data/raw/manifest.json",
  "data/raw/extraction_log.json",
  "data/raw/openfda_download_index.json",
  "data/raw/counts/*.json",
  "data/raw/vmsr/vmsr_page.html",
  "data/raw/vmsr/vmsr_eligible_product_codes.zip",
  "data/reference/excluded_product_codes.csv",
  "data/reference/product_code_classification.csv",
  "data/reference/known_events.csv",
  "data/conformed/monthly_report_count.csv",
  "data/conformed/monthly_lag_matched.csv",
  "data/conformed/lag_summary.csv",
  "data/conformed/quarantine.csv",
  "data/conformed/exclusion_receipt.csv",
  "data/conformed/monthly_event_type.csv",
  "data/conformed/monthly_remedial_recall.csv",
  "data/conformed/product_code.csv",
  "data/conformed/cohort_gate.csv",
  "data/conformed/forecast.csv",
  "data/conformed/forecast_states.csv",
  "data/conformed/forecast_scored.csv",
  "data/conformed/forecast_score.csv",
  "data/conformed/review_queue.csv",
  "data/conformed/review_workload.csv",
  "data/conformed/recall_context.csv",
  "data/conformed/recall_count.json",
  "data/conformed/recall_context_meta.json",
  "governance/source-register.md",
  "governance/exclusion-receipt-records.md",
  # Phase 4: the rendered page, every figure on it computed from the tables
  # above. docs/renders/* is NOT listed, for the reason cascadia-matter-ledger
  # recorded: the renders are review artifacts that change with chart code,
  # and binding them to a data-freeze baseline makes the gate cry wolf.
  #
  # KNOWN INTERACTION WITH THE LIVE EDGE (Phase 5). reconcile_live_edge.py
  # rebuilds docs/index.html after every scheduled run so the page's health
  # surface stays level with the record; from the first such run this gate
  # reports the page as moved until Aaron commits the run record and moves
  # this baseline. Matter Ledger resolved the same conflict by leaving its
  # page out of the list. This module keeps the page IN, because the page
  # is the frozen forecast and the plan says so; whether to adopt Matter
  # Ledger's answer once the task is scheduled is Aaron's call, recorded in
  # the build receipt as an open item.
  "docs/index.html",
]

# No permitted_edit entries. An exemption is a path that is no longer checked.
